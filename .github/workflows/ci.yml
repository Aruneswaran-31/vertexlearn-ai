name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the production server
        run: |
          node dist/server/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:4000/api/v1/health
          curl -fsS http://localhost:4000/ | head -c 200
          kill $SERVER_PID
